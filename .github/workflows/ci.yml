name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe DEPLOY para confirmar el despliegue a produccion"
        required: true
        type: string

jobs:

  # ============================================================
  # 1. VERIFICACIONES DEL FRONTEND
  # ============================================================
  frontend:
    name: Frontend - Lint, Build y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npx vitest run --coverage

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar pruebas E2E
        run: npx playwright test


  # ============================================================
  # 2. VERIFICACIONES DEL BACKEND
  # ============================================================
  backend:
    name: Backend - Build, Pruebas y Migraciones
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_manager_test
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Ejecutar migraciones
        run: npx prisma migrate deploy

      - name: Compilar backend
        run: npm run build

      - name: Ejecutar pruebas del backend
        run: npm test


  # ============================================================
  # 3. DESPLIEGUE AUTOMÁTICO A STAGING
  # ============================================================
  deploy-staging:
    name: Deploy a Staging
    needs:
      - frontend
      - backend

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar backend a Railway Staging
        run: railway up --service Task_Manager_React --environment staging
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}


  # ============================================================
  # 4. DESPLIEGUE MANUAL A PRODUCCIÓN
  # ============================================================
  deploy-produccion:
    name: Deploy a Producción Manual

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmacion == 'DEPLOY'

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar backend a Railway Producción
        run: railway up --service Task_Manager_React --environment production
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}